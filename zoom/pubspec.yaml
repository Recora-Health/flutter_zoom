name: zoom
description: A Flutter plugin for the Zoom Client SDK.
version: 3.0.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.29.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.0

dev_dependencies:
  args: ^2.4.2
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.webcare.zoom
        pluginClass: ZoomPlugin
      ios:
        pluginClass: ZoomPlugin
