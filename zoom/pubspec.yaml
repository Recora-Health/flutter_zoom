name: zoom
description: A Flutter plugin for the Zoom Client SDK.
version: 1.3.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  zoom_platform_interface:
    git:
      url: git@github.com:Recora-Health/flutter_zoom.git
      ref: 6.2.11
      path: zoom/zoom_platform_interface

dev_dependencies:
  args: ^2.4.2
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.webcare.zoom
        pluginClass: ZoomPlugin
      ios:
        pluginClass: ZoomPlugin
