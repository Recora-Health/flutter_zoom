# Only the Zoom SDK's own packages (and the few libraries Zoom documents) are
# kept whole. The blanket androidx.** / android.support.** / com.google.** / b.**
# keeps and the global -dontoptimize / -dontobfuscate that used to accompany
# them are gone: they pinned most of the host app's DEX and fail Google Play's
# optimized-DEX requirement (enforced Feb 2027). Global R8 options cannot live
# in a library's consumer rules under AGP 9 anyway.

-keep class  us.zoom.**{*;}
-keep class  com.zipow.**{*;}
-keep class  us.zipow.**{*;}
-keep class  org.webrtc.**{*;}
-keep class  us.google.protobuf.**{*;}
-keep class  com.google.crypto.tink.**{*;}
-keep class  androidx.security.crypto.**{*;}

-keep class * extends android.content.BroadcastReceiver { *; }
-dontwarn com.android.**
-dontwarn com.google.**
-dontwarn com.microsoft.**
-dontwarn com.zipow.**
-dontwarn javax.lang.**
-dontwarn kotlin.jvm.internal.**
-dontwarn kotlinx.parcelize.**
-dontwarn org.**
-dontwarn us.zoom.**
-dontwarn xcrash.**
-dontwarn java.awt.**
-dontwarn javax.swing.**
-dontwarn kotlin.uuid.ExperimentalUuidApi
-dontwarn kotlin.uuid.Uuid$Companion
-dontwarn kotlin.uuid.Uuid

# BlueParrott SDK - Optional Bluetooth headset support
# The real SDK is not bundled (would push us over the 200MB Play limit).
# Instead we ship no-op stubs in src/main/java/com/blueparrott/blueparrottsdk/ so
# the Zoom SDK's jabra.* classes can resolve at runtime. Keep the stubs from R8 —
# nothing in plugin Java code references them, so without -keep they'd be stripped.
-keep class com.blueparrott.blueparrottsdk.** { *; }
-dontwarn com.blueparrott.blueparrottsdk.**

# Jabra SDK - Optional Bluetooth headset support (referenced by mobilertc.aar WebRTC)
-dontwarn jabra.**