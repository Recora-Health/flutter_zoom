# The Zoom SDK's own packages (and the few libraries Zoom documents) are kept
# whole, with one exception: us.zoom.proguard.**, described below. The blanket
# androidx.** / android.support.** / com.google.** / b.** keeps and the global
# -dontoptimize / -dontobfuscate that used to accompany them are gone: they
# pinned most of the host app's DEX and fail Google Play's optimized-DEX
# requirement (25% minimum, enforced Feb 2027). Global R8 options cannot live in
# a library's consumer rules under AGP 9 anyway.
#
# This goes beyond Zoom's published rules, which keep all of us.zoom.**. With
# those, the host app scores 17% in Play Console; with the rules below, 25.7%.
# Play's score is 100 minus the stats in the host app's
# build/app/intermediates/r8_metadata/<variant>/.../r8-metadata.dat.

-keep class  com.zipow.**{*;}
-keep class  us.zipow.**{*;}
-keep class  org.webrtc.**{*;}
-keep class  us.google.protobuf.**{*;}
-keep class  com.google.crypto.tink.**{*;}
-keep class  androidx.security.crypto.**{*;}

# us.zoom.proguard.** is the SDK's already-obfuscated internal code (about a
# fifth of the host app's methods) and is left to R8; every other us.zoom
# package stays whole. Evidence it is safe to release, for SDK 7.1.6: no native
# library references a class in it (neither "us/zoom/proguard/" JNI class
# paths nor Java_us_zoom_proguard_ symbols), and only the five classes below
# are named in string constants. Re-check both on every SDK upgrade, since the
# obfuscated names change:
#   unzip -p libs/mobilertc.aar classes.jar | strings -n 10 \
#     | grep -oE 'us\.zoom\.proguard\.[A-Za-z0-9_$]+' | sort -u
-keep class !us.zoom.proguard.**,us.zoom.** {*;}
-keep class us.zoom.proguard.ct6 {*;}
-keep class us.zoom.proguard.o75 {*;}
-keep class us.zoom.proguard.r94 {*;}
-keep class us.zoom.proguard.ue0 {*;}
-keep class us.zoom.proguard.xt {*;}

# Reflection inside the SDK that the release of us.zoom.proguard.** exposes.
# Found by scanning classes.jar for java.lang.reflect use; re-derive on every
# SDK upgrade (mc6, go1 and the span classes are obfuscated names and will
# change).
#
# 1. Base classes that read their subclass's generic superclass
#    (getGenericSuperclass). R8 drops the Signature attribute of classes no
#    rule matches, which crashed in-meeting chat (ZMBaseStyle = mc6) with
#    "Class cannot be cast to ParameterizedType". Same shape as Gson's
#    TypeToken rule: keeps the signature and stops class merging.
#    The base class itself must be matched too: without its own signature R8
#    rewrites each subclass's "extends ZMBaseStyle<Span>" to the raw type.
#    The span classes used as type arguments are matched so R8 cannot merge
#    them (the base class passes them to Spanned.getSpans()).
-keep,allowobfuscation,allowshrinking class us.zoom.proguard.mc6
-keep,allowobfuscation,allowshrinking class * extends us.zoom.proguard.mc6
-keep,allowobfuscation,allowshrinking class us.zoom.proguard.hh6
-keep,allowobfuscation,allowshrinking class us.zoom.proguard.hq6
-keep,allowobfuscation,allowshrinking class us.zoom.proguard.kj6
-keep,allowobfuscation,allowshrinking class us.zoom.proguard.lh6
-keep,allowobfuscation,allowshrinking class us.zoom.proguard.or6
-keep,allowobfuscation,allowshrinking class us.zoom.proguard.ph6
-keep,allowobfuscation,allowshrinking class us.zoom.proguard.qc6
-keep,allowobfuscation,allowshrinking class us.zoom.proguard.to6
-keep,allowobfuscation,allowshrinking class us.zoom.proguard.uc6
-keep,allowobfuscation,allowshrinking class us.zoom.proguard.ur6
-keep,allowobfuscation,allowshrinking class us.zoom.proguard.ap6
-keep,allowobfuscation,allowshrinking class * extends com.zipow.uilib.widget.recyclerview.ZMBaseRecyclerViewAdapter
-keep,allowobfuscation,allowshrinking class * extends us.zoom.uicommon.widget.recyclerview.ZMBaseRecyclerViewAdapter
# 2. Methods the SDK finds through runtime annotations.
-keepclassmembers class * { @us.zoom.annotation.SystemEvent <methods>; }
-keepclassmembers class * { @us.zoom.zapp.web.jshandler.JsMethod <methods>; }
-keepclassmembers class * {
    @us.zoom.xbinder.annotation.AsyncCall <methods>;
    @us.zoom.xbinder.annotation.OnewayCall <methods>;
}
# 3. IMSettingKeyEnum (go1) enumerates the fields of its nested key holders.
-keepclassmembers class us.zoom.proguard.go1$* { <fields>; }

# androidx / Material members the SDK reads by name through reflection. These
# need keeping whether or not us.zoom.proguard.** is released: they were
# covered by the old blanket androidx.** / com.google.** keeps.
-keepclassmembers class androidx.viewpager.widget.ViewPager { int mRestoredCurItem; }
-keepclassmembers class androidx.viewpager.widget.ViewPager$LayoutParams { int position; }
-keepclassmembers class androidx.viewpager2.widget.ViewPager2 { int mCurrentItem; }
-keepclassmembers class androidx.fragment.app.FragmentManager { boolean mExecutingActions; }
-keepclassmembers class androidx.lifecycle.ViewModelStore { *** map; *** mMap; }
-keepclassmembers class androidx.lifecycle.ViewModelProvider { *** DEFAULT_KEY; }
-keepclassmembers class androidx.lifecycle.ViewModelProvider$AndroidViewModelFactory { *** DEFAULT_KEY; }
-keep class com.google.android.material.slider.BaseSlider { *** labels; }
-keep class com.google.android.material.snackbar.Snackbar
-keepclassmembers class com.google.android.material.snackbar.BaseTransientBottomBar { *** originalMargins; }
-keepclassmembers class com.google.android.material.tooltip.TooltipDrawable { *** getTextAppearance(); }
-keepclassmembers class com.google.android.material.resources.TextAppearance { *** setTextColor(android.content.res.ColorStateList); }
-keepclassmembers class com.google.android.material.tabs.TabLayout$TabView { *** textView; }

-keep class * extends android.content.BroadcastReceiver { *; }
-dontwarn com.android.**
-dontwarn com.google.**
-dontwarn com.microsoft.**
-dontwarn com.zipow.**
-dontwarn javax.lang.**
-dontwarn kotlin.jvm.internal.**
-dontwarn kotlinx.parcelize.**
-dontwarn org.**
-dontwarn us.zoom.**
-dontwarn xcrash.**
-dontwarn java.awt.**
-dontwarn javax.swing.**
-dontwarn kotlin.uuid.ExperimentalUuidApi
-dontwarn kotlin.uuid.Uuid$Companion
-dontwarn kotlin.uuid.Uuid

# BlueParrott SDK - Optional Bluetooth headset support
# The real SDK is not bundled (would push us over the 200MB Play limit).
# Instead we ship no-op stubs in src/main/java/com/blueparrott/blueparrottsdk/ so
# the Zoom SDK's jabra.* classes can resolve at runtime. Keep the stubs from R8 —
# nothing in plugin Java code references them, so without -keep they'd be stripped.
-keep class com.blueparrott.blueparrottsdk.** { *; }
-dontwarn com.blueparrott.blueparrottsdk.**

# Jabra SDK - Optional Bluetooth headset support (referenced by mobilertc.aar WebRTC)
-dontwarn jabra.**