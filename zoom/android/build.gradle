group 'com.webcare.zoom'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.1.2'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        jcenter()

        flatDir {
            dirs project(':zoom').file('libs')
        }
    }
}

apply plugin: 'com.android.library'

android {
    compileSdkVersion 34
    buildToolsVersion = "30.0.3"

    viewBinding {
        enabled = true
    }

    defaultConfig {
        minSdkVersion 28
        targetSdkVersion 34
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        consumerProguardFiles 'proguard.txt'
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        disable 'InvalidPackage'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {


    implementation  'androidx.recyclerview:recyclerview:1.2.1'
    implementation  'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.20'
    implementation  'androidx.collection:collection:1.1.0'
    implementation  'androidx.annotation:annotation:1.3.0'
    implementation  'androidx.appcompat:appcompat:1.5.0'
    implementation  'androidx.drawerlayout:drawerlayout:1.1.1'
    implementation  'androidx.vectordrawable:vectordrawable:1.1.0'
    implementation  'org.jetbrains.kotlin:kotlin-stdlib-common:1.7.20'
    implementation  'androidx.core:core:1.8.0'
    implementation  'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.2'
    implementation  'androidx.lifecycle:lifecycle-runtime:2.6.1'
    implementation  'androidx.lifecycle:lifecycle-viewmodel:2.6.1'
    implementation  'androidx.fragment:fragment:1.4.1'
    implementation  'androidx.activity:activity:1.6.1'
    implementation  'androidx.lifecycle:lifecycle-livedata-core-ktx:2.6.1'
    implementation  'androidx.annotation:annotation-experimental:1.1.0'
    implementation  'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.6.1'
    implementation  'androidx.lifecycle:lifecycle-livedata-core:2.6.1'
    implementation  'androidx.vectordrawable:vectordrawable-animated:1.1.0'
    implementation  'androidx.customview:customview:1.1.0'
    implementation  'androidx.lifecycle:lifecycle-common:2.6.1'
    implementation  'androidx.arch.core:core-common:2.2.0'
    implementation  'androidx.arch.core:core-runtime:2.2.0'
    implementation  'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'
    implementation  'androidx.activity:activity-ktx:1.6.1'
    implementation  'androidx.savedstate:savedstate:1.2.0'
    implementation  'androidx.lifecycle:lifecycle-livedata:2.6.1'
    implementation  'androidx.concurrent:concurrent-futures:1.1.0'
    implementation  'androidx.savedstate:savedstate-ktx:1.2.0'
    implementation  'androidx.lifecycle:lifecycle-process:2.6.1'
    implementation  'androidx.startup:startup-runtime:1.2.0-alpha02'
    implementation  'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation  'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.5.2'
    implementation  'androidx.databinding:viewbinding:7.1.2'


// OR FAIL BELOW

    implementation "androidx.security:security-crypto:1.1.0-alpha05"
    implementation "com.google.crypto.tink:tink-android:1.7.0"
    implementation "com.google.android.exoplayer:exoplayer-core:2.17.1"
    implementation "com.google.android.exoplayer:exoplayer-ui:2.17.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    // implementation "androidx.appcompat:appcompat:1.3.1"
    implementation "androidx.constraintlayout:constraintlayout:2.1.0"
    implementation "com.google.android.material:material:1.8.0"
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "com.google.code.gson:gson:2.9.1"
    implementation "com.github.bumptech.glide:annotations:4.11.0"
    implementation "com.github.bumptech.glide:glide:4.11.0"
    implementation "com.airbnb.android:lottie:4.0.0"
    implementation "androidx.window:window:1.0.0"
    implementation "androidx.window:window-java:1.0.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.20"
    implementation "androidx.core:core-ktx:1.8.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.1"
    implementation "androidx.fragment:fragment-ktx:1.4.1"
    implementation "androidx.core:core-splashscreen:1.0.1"

    api(name: 'mobilertc', ext: 'aar')
}

